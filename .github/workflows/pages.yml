name: Build and deploy Search Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - name: Test parsers and application controllers
        run: node --test tests/*.test.mjs
      - name: Build all six languages
        run: node scripts/build.mjs
      - name: Validate every page, link and sitemap alternate
        run: python3 scripts/validate.py
      - name: Check reproducible static output
        run: git diff --exit-code -- dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
